version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_segmentation_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./backend/data/production.db
      - WHATSAPP_LIVE_MODE=false
      - SECRET_KEY=production-secret-key-change-in-env
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8000
    volumes:
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_data:
